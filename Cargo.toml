[package]
name = "axum-github-oauth"
version = "2.0.0"
edition = "2021"

[dependencies]
axum = { version = "0.8" }
axum-extra = { version = "0.12", features = ["typed-header", "cookie-private"] }
http = "1.0"
oauth2 = { version = "5.0", features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
sha2 = "0.10"
serde_json = "1.0"
cookie = "0.18"
url = "2.5"
thiserror = "2.0"
